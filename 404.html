    <!-- Fonts: Manrope (Mint & Charcoal Financial) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <!-- Prevent FOUC / White Screen Flash on initial load & navigation -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('personal_app_theme');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var isDark = saved === 'dark' || (!saved && prefersDark);
          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.style.backgroundColor = '#101211';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.style.backgroundColor = '#f9f9fc';
          }
        } catch (e) {}
      })();
    </script>
    <style>html,body,#app{background-color:#f9f9fc;min-height:100dvh;margin:0;padding:0}html.dark,html.dark body,html.dark #app{background-color:#101211!important}</style>
