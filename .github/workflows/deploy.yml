name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'package-lock.json'

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        env:
          VITE_BASE_PATH: /be-pung-app/
          VITE_API_BASE_URL: https://dandy-lightgray-sandpiper-04.hostingersite.com/api/v1/personal-app
          VITE_BACKEND_URL: https://dandy-lightgray-sandpiper-04.hostingersite.com
          VITE_PUBLIC_URL: https://amalebu.github.io/be-pung-app
        run: |
          npm run build
          cp dist/index.html dist/404.html

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
